org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Certains plugins Flutter tiers (ex. home_widget 0.9.0) codent en dur un
# Java compileOptions=1.8 dans leur propre build.gradle, impossible a
# surcharger de facon fiable depuis le projet racine (le plugin l'ecrit
# apres, dans son propre script). Kotlin est force a 17 partout (voir
# android/build.gradle.kts) independamment du Java de chaque module -- ceci
# desactive uniquement la VALIDATION de coherence Java/Kotlin (un garde-fou,
# pas une vraie incompatibilite : D8/dexing accepte un melange de versions
# de bytecode par classe).
kotlin.jvm.target.validation.mode=warning
